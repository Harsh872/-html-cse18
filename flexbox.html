<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Layout</title>
    <style>
        body{
            margin: 0;
            padding: 0;

        }
        html, *{
            margin: 0;
            box-sizing: border-box;
        }
        main{
            width: 1200px;
            height: 1000px;
            background-color: aqua;
            margin: 0px auto;
            display: flex;
            flex-direction:column;
            gap: 10px;

    
        }
        nav, header, footer{
            background-color: rgb(190, 241, 2);
            height: 140px;

        }
        section{
            height: 300px;
            background-color: blueviolet;
        }
    </style>
</head>
<body>
    <main>
        <nav><h2>Navigation</h2></nav>
        <header><h2>Header</h2></header>
        <article><h2>section</h2></article>
        <section><h2>Section</h2></section>
        <footer><h2>Footer</h2></footer>

    </main>
    
</body>
</html>
